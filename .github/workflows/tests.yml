name: CPU engineering tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/base.txt -r requirements/dev.txt
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q
      - run: python scripts/smoke.py --output runs/ci-smoke --device cpu
# Native compilation, GPU and original-game differential validation are NOT covered here.
